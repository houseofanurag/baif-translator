<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BAIF Offline Translator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .heading-font { font-family: 'Space Grotesk', sans-serif; }
    .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px); }
    .hero-bg { background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%); }
  </style>
</head>
<body class="bg-slate-100 min-h-screen">

  <!-- Header -->
  <header class="bg-white shadow-sm border-b sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-8 py-5 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <div class="w-11 h-11 bg-blue-600 text-white rounded-3xl flex items-center justify-center text-3xl font-bold">🇮🇳</div>
        <div>
          <h1 class="heading-font text-3xl font-semibold text-slate-800">BAIF Translator</h1>
          <p class="text-xs text-emerald-600 font-medium">Offline • Field Ready</p>
        </div>
      </div>
      <div class="flex items-center gap-6 text-sm">
        <span class="px-6 py-2.5 bg-emerald-100 text-emerald-700 rounded-3xl font-semibold tracking-wider">100% OFFLINE</span>
      </div>
    </div>
  </header>

  <div class="max-w-7xl mx-auto px-8 py-10">

    <!-- Hero -->
    <div class="hero-bg rounded-3xl p-10 text-white mb-12">
      <h2 class="text-5xl font-semibold heading-font mb-3">Offline Translation Tool</h2>
      <p class="text-blue-100 text-lg">Transcribe • Translate • Generate Voice & Subtitles</p>
    </div>

    <div class="grid lg:grid-cols-12 gap-8">

      <!-- Main Area -->
      <div class="lg:col-span-8 space-y-8">

        <!-- Upload + Translation -->
        <div class="grid md:grid-cols-2 gap-6">
          <!-- Transcription Card -->
          <div class="glass rounded-3xl p-8 shadow-xl">
            <div class="flex items-center gap-4 mb-6">
              <i class="fas fa-microphone text-4xl text-blue-600"></i>
              <div>
                <h3 class="text-2xl font-semibold">1. Transcription</h3>
                <p class="text-slate-500">Upload audio or video</p>
              </div>
            </div>
            <input type="file" id="mediaFile" accept="audio/*,video/*" 
                   class="w-full text-sm text-slate-500 file:mr-4 file:py-4 file:px-8 file:rounded-2xl file:border-0 file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer transition-all">
            <button onclick="transcribe()" id="transcribeBtn"
                    class="mt-8 w-full bg-blue-600 hover:bg-blue-700 py-4 rounded-2xl text-white font-semibold text-lg transition">
              🚀 Start Transcription
            </button>
            <div id="fileName" class="mt-3 text-xs text-slate-500 text-center"></div>
          </div>

          <!-- Translation Card -->
          <div class="glass rounded-3xl p-8 shadow-xl">
            <div class="flex items-center gap-4 mb-6">
              <i class="fas fa-language text-4xl text-emerald-600"></i>
              <div>
                <h3 class="text-2xl font-semibold">2. Translation</h3>
                <p class="text-slate-500">Choose target language</p>
              </div>
            </div>
            <select id="targetLang" class="w-full p-4 border border-slate-300 rounded-2xl text-lg focus:outline-none focus:border-emerald-500">
              <option value="en">English</option>
              <option value="hi">Hindi</option>
              <option value="mr">Marathi</option>
            </select>
            <button onclick="translateText()" id="translateBtn" disabled
                    class="mt-8 w-full bg-emerald-600 hover:bg-emerald-700 py-4 rounded-2xl text-white font-semibold text-lg transition disabled:opacity-50">
              🌐 Translate Text
            </button>
          </div>
        </div>

        <!-- Result -->
        <div class="glass rounded-3xl p-8 shadow-xl min-h-[340px]">
          <div id="resultContent" class="grid md:grid-cols-2 gap-8"></div>
        </div>

        <!-- Extra Outputs -->
        <div id="audioPlayer" class="mt-4"></div>
        <div id="srtLink" class="mt-4 text-center"></div>
        <div id="burnedVideoLink" class="mt-4 text-center"></div>
      </div>

      <!-- Sidebar -->
      <div class="lg:col-span-4 space-y-6">

        <!-- Quick Actions -->
        <div class="glass rounded-3xl p-8 shadow-xl">
          <h3 class="font-semibold text-lg mb-6">Quick Actions</h3>
          <div class="grid grid-cols-2 gap-4">
            <button onclick="generateTTS()" id="ttsBtn" disabled 
                    class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-5 rounded-2xl flex flex-col items-center gap-2 disabled:opacity-50 transition">
              <i class="fas fa-volume-up text-2xl"></i>
              <span class="text-sm">Generate Voice</span>
            </button>
            <button onclick="generateSRT()" id="srtBtn" disabled 
                    class="bg-amber-600 hover:bg-amber-700 text-white font-semibold py-5 rounded-2xl flex flex-col items-center gap-2 disabled:opacity-50 transition">
              <i class="fas fa-file-alt text-2xl"></i>
              <span class="text-sm">Generate SRT</span>
            </button>
            <button onclick="burnSubtitles()" id="burnBtn" disabled 
                    class="bg-red-600 hover:bg-red-700 text-white font-semibold py-5 rounded-2xl flex flex-col items-center gap-2 disabled:opacity-50 transition">
              <i class="fas fa-fire text-2xl"></i>
              <span class="text-sm">Burn Subtitles</span>
            </button>
            <button onclick="downloadTranslatedText()" id="downloadBtn" disabled 
                    class="bg-violet-600 hover:bg-violet-700 text-white font-semibold py-5 rounded-2xl flex flex-col items-center gap-2 disabled:opacity-50 transition">
              <i class="fas fa-download text-2xl"></i>
              <span class="text-sm">Download Text</span>
            </button>
          </div>
          <button onclick="clearAll()" 
                  class="mt-6 w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium py-3 rounded-2xl transition">
            🗑️ Clear All
          </button>
        </div>

        <!-- History -->
        <div class="glass rounded-3xl p-8 shadow-xl">
          <h3 class="font-semibold text-lg mb-5 flex items-center gap-2">
            <i class="fas fa-history"></i> Recent Translations
          </h3>
          <div id="historyList" class="space-y-4 text-sm max-h-[420px] overflow-y-auto"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Status Bar -->
  <div id="status" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-white shadow-2xl rounded-3xl px-8 py-3 text-sm font-medium hidden"></div>

  <script src="/static/js/app.js"></script>
</body>
</html>
