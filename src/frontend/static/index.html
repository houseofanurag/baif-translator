<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BAIF Offline Translator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .heading-font { font-family: 'Space Grotesk', sans-serif; }
    .glass { background: rgba(255, 255, 255, 0.97); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="bg-slate-50 min-h-screen">

  <!-- Header -->
  <header class="bg-white shadow-sm sticky top-0 z-50 border-b">
    <div class="max-w-6xl mx-auto px-6 py-5 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-blue-600 text-white rounded-2xl flex items-center justify-center text-2xl font-bold">🇮🇳</div>
        <div>
          <h1 class="heading-font text-3xl font-semibold text-slate-800">BAIF Translator</h1>
          <p class="text-xs text-slate-500 -mt-1">Offline • Secure • Field Ready</p>
        </div>
      </div>
      <div class="flex items-center gap-6 text-sm">
        <span class="px-5 py-2 bg-emerald-100 text-emerald-700 rounded-3xl font-semibold text-xs tracking-wider">100% OFFLINE</span>
        <span class="text-slate-500">English • Hindi • Marathi</span>
      </div>
    </div>
  </header>

  <div class="max-w-5xl mx-auto p-6 pt-10">

    <div class="text-center mb-12">
      <h2 class="text-5xl font-semibold heading-font text-slate-800 mb-3">Offline Translation Tool</h2>
      <p class="text-slate-600 text-lg">Helping BAIF teams transcribe, translate, and generate outputs</p>
    </div>

    <div class="grid md:grid-cols-2 gap-8">

      <!-- Transcription -->
      <div class="glass rounded-3xl p-8 shadow-xl border border-slate-100">
        <div class="flex items-center gap-4 mb-6">
          <i class="fas fa-microphone text-3xl text-blue-600"></i>
          <div>
            <h3 class="text-2xl font-semibold">1. Transcription</h3>
            <p class="text-sm text-slate-500">Upload audio or video</p>
          </div>
        </div>
        <input type="file" id="mediaFile" accept="audio/*,video/*" 
               class="w-full text-sm text-slate-500 file:mr-4 file:py-4 file:px-8 file:rounded-2xl file:border-0 file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer transition">
        <button onclick="transcribe()" id="transcribeBtn"
                class="mt-8 w-full bg-blue-600 hover:bg-blue-700 py-4 rounded-2xl text-white font-semibold text-lg transition">
          🚀 Start Transcription
        </button>
        <div id="fileName" class="mt-3 text-xs text-slate-500 text-center"></div>
      </div>

      <!-- Translation -->
      <div class="glass rounded-3xl p-8 shadow-xl border border-slate-100">
        <div class="flex items-center gap-4 mb-6">
          <i class="fas fa-language text-3xl text-emerald-600"></i>
          <div>
            <h3 class="text-2xl font-semibold">2. Translation</h3>
            <p class="text-sm text-slate-500">Choose target language</p>
          </div>
        </div>
        <select id="targetLang" class="w-full p-4 border border-slate-300 rounded-2xl text-lg">
          <option value="en">English</option>
          <option value="hi">Hindi</option>
          <option value="mr">Marathi</option>
        </select>
        <button onclick="translateText()" id="translateBtn" disabled
                class="mt-8 w-full bg-emerald-600 hover:bg-emerald-700 py-4 rounded-2xl text-white font-semibold text-lg transition disabled:opacity-50">
          🌐 Translate Text
        </button>
      </div>

    </div>

    <!-- Quick Actions -->
    <div class="mt-12 flex flex-wrap gap-4 justify-center">
      <button onclick="generateTTS()" id="ttsBtn" disabled
              class="flex-1 md:flex-none bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-4 px-10 rounded-3xl flex items-center justify-center gap-3 text-lg disabled:opacity-50">
        <i class="fas fa-volume-up"></i> Generate Voice
      </button>
      <button onclick="generateSRT()" id="srtBtn" disabled
              class="flex-1 md:flex-none bg-amber-600 hover:bg-amber-700 text-white font-semibold py-4 px-10 rounded-3xl flex items-center justify-center gap-3 text-lg disabled:opacity-50">
        <i class="fas fa-file-alt"></i> Generate SRT
      </button>
      <button onclick="burnSubtitles()" id="burnBtn" disabled
              class="flex-1 md:flex-none bg-red-600 hover:bg-red-700 text-white font-semibold py-4 px-10 rounded-3xl flex items-center justify-center gap-3 text-lg disabled:opacity-50">
        <i class="fas fa-fire"></i> Burn Subtitles into Video
      </button>
      <button onclick="downloadTranslatedText()" id="downloadBtn" disabled
              class="flex-1 md:flex-none bg-violet-600 hover:bg-violet-700 text-white font-semibold py-4 px-10 rounded-3xl flex items-center justify-center gap-3 text-lg disabled:opacity-50">
        <i class="fas fa-download"></i> Download Translated Text
      </button>
    </div>

    <!-- Status -->
    <div id="status" class="mt-8 text-center font-medium text-lg min-h-[40px]"></div>

    <!-- Side-by-Side Result -->
    <div id="result" class="mt-6 bg-white rounded-3xl p-8 shadow min-h-[280px]">
      <div id="resultContent" class="grid md:grid-cols-2 gap-8"></div>
    </div>

    <!-- Audio Player -->
    <div id="audioPlayer" class="mt-6"></div>

    <!-- SRT Download -->
    <div id="srtLink" class="mt-6 text-center"></div>

    <!-- Burned Video -->
    <div id="burnedVideoLink" class="mt-6 text-center"></div>

  </div>

  <script>
    let currentText = "";
    let currentTranslatedText = "";
    let currentSegments = [];
    let currentFileName = "";
    let currentSrtFileName = "";

    function updateButtonStates() {
      const hasTranscription = currentText.length > 0;
      const hasTranslation = currentTranslatedText.length > 0;
      
      document.getElementById('translateBtn').disabled = !hasTranscription;
      document.getElementById('srtBtn').disabled = !hasTranscription;
      document.getElementById('burnBtn').disabled = !hasTranscription;
      document.getElementById('downloadBtn').disabled = !hasTranslation;
      document.getElementById('ttsBtn').disabled = !hasTranscription;
    }

    function renderResult() {
      const container = document.getElementById('resultContent');
      let html = '';

      if (currentText) {
        html += `
          <div>
            <h4 class="font-semibold text-blue-700 mb-3 flex items-center gap-2">
              <i class="fas fa-file-alt"></i> Original Text
            </h4>
            <div class="bg-slate-50 p-5 rounded-2xl text-slate-700 leading-relaxed whitespace-pre-wrap">${currentText}</div>
          </div>`;
      }

      if (currentTranslatedText) {
        const targetLang = document.getElementById('targetLang').value.toUpperCase();
        html += `
          <div>
            <h4 class="font-semibold text-emerald-700 mb-3 flex items-center gap-2">
              <i class="fas fa-language"></i> Translated (${targetLang})
            </h4>
            <div class="bg-emerald-50 p-5 rounded-2xl text-slate-700 leading-relaxed whitespace-pre-wrap">${currentTranslatedText}</div>
          </div>`;
      }

      container.innerHTML = html || '<p class="text-slate-400 text-center py-12">Results will appear here...</p>';
    }

    // ==================== Existing Functions (Updated) ====================

    async function transcribe() {
      const fileInput = document.getElementById('mediaFile');
      const status = document.getElementById('status');
      if (!fileInput.files.length) return alert("Please select a file");

      currentFileName = fileInput.files[0].name;
      document.getElementById('fileName').textContent = `File: ${currentFileName}`;

      currentText = currentTranslatedText = "";
      currentSegments = [];
      document.getElementById('resultContent').innerHTML = "";
      document.getElementById('audioPlayer').innerHTML = "";
      document.getElementById('srtLink').innerHTML = "";
      document.getElementById('burnedVideoLink').innerHTML = "";

      status.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i> Transcribing ${currentFileName}...`;

      const formData = new FormData();
      formData.append("file", fileInput.files[0]);

      try {
        const res = await fetch("/transcribe", { method: "POST", body: formData });
        const data = await res.json();
        if (data.status === "success") {
          currentText = currentTranslatedText = data.transcribed_text;
          currentSegments = data.segments || [];
          status.innerHTML = `✅ Transcription Completed`;
          renderResult();
          updateButtonStates();
        }
      } catch (e) {
        status.innerHTML = `❌ Transcription Failed`;
      }
    }

    async function translateText() {
      const status = document.getElementById('status');
      const targetLang = document.getElementById('targetLang').value;

      if (!currentText) return;

      status.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i> Translating...`;

      const formData = new FormData();
      formData.append("text", currentText);
      formData.append("target_lang", targetLang);

      try {
        const res = await fetch("/translate", { method: "POST", body: formData });
        const data = await res.json();
        if (data.status === "success") {
          currentTranslatedText = data.translated;
          status.innerHTML = `✅ Translation Completed`;
          renderResult();
          updateButtonStates();
        }
      } catch (e) {
        status.innerHTML = `❌ Translation Failed`;
      }
    }

    async function generateTTS() {
      const status = document.getElementById('status');
      const audioDiv = document.getElementById('audioPlayer');
      const targetLang = document.getElementById('targetLang').value;

      if (!currentTranslatedText) return;

      status.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i> Generating Voice...`;

      const formData = new FormData();
      formData.append("text", currentTranslatedText);
      formData.append("lang", targetLang);

      try {
        const res = await fetch("/tts", { method: "POST", body: formData });
        const data = await res.json();

        if (data.status === "success" && data.audio_url) {
          status.innerHTML = `✅ Voice Generated!`;
          audioDiv.innerHTML = `<audio controls class="w-full mt-4"><source src="${data.audio_url}" type="audio/mp3"></audio>`;
        } else {
          // Show proper message for non-English
          status.innerHTML = data.message || `❌ Voice not available for ${targetLang.toUpperCase()} yet`;
        }
      } catch (e) {
        status.innerHTML = `❌ Voice Generation Failed`;
      }
    }

    async function generateSRT() {
      const status = document.getElementById('status');
      const srtDiv = document.getElementById('srtLink');

      if (currentSegments.length === 0) {
        alert("Please transcribe first!");
        return;
      }

      status.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i> Generating SRT...`;

      const formData = new FormData();
      formData.append("segments", JSON.stringify(currentSegments));
      formData.append("filename", currentFileName || "baif_recording");

      try {
        const res = await fetch("/generate_srt", { method: "POST", body: formData });
        const data = await res.json();
        
        if (data.status === "success") {
          currentSrtFileName = data.srt_url.split('/').pop();
          status.innerHTML = `✅ SRT Generated!`;
          srtDiv.innerHTML = `
            <a href="${data.srt_url}" download 
               class="inline-flex items-center gap-3 bg-amber-600 text-white px-8 py-4 rounded-3xl hover:bg-amber-700">
              📥 Download SRT Subtitle File
            </a>`;
        }
      } catch (e) {
        status.innerHTML = `❌ SRT Generation Failed`;
      }
    }

    async function burnSubtitles() {
      const status = document.getElementById('status');
      const burnedDiv = document.getElementById('burnedVideoLink');

      if (currentSegments.length === 0) return alert("Please generate SRT first!");

      status.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i> Burning subtitles into video...`;

      const fileInput = document.getElementById('mediaFile');
      if (!fileInput.files.length) return alert("Please upload the original video again");

      const formData = new FormData();
      formData.append("original_video", fileInput.files[0]);
      formData.append("srt_filename", currentSrtFileName);

      try {
        const res = await fetch("/burn_subtitles", { method: "POST", body: formData });
        const data = await res.json();
        if (data.status === "success") {
          status.innerHTML = `✅ Subtitles Burned!`;
          burnedDiv.innerHTML = `
            <a href="${data.video_url}" download 
               class="inline-flex items-center gap-3 bg-red-600 text-white px-8 py-4 rounded-3xl hover:bg-red-700">
              📥 Download Video with Burned Subtitles
            </a>`;
        } else {
          status.innerHTML = `❌ ${data.message}`;
        }
      } catch (e) {
        status.innerHTML = `❌ Failed to burn subtitles`;
      }
    }

    function downloadTranslatedText() {
      if (!currentTranslatedText) return alert("No translated text available");
      const targetLang = document.getElementById('targetLang').value;
      const blob = new Blob([currentTranslatedText], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `translated_${targetLang}_${currentFileName || 'output'}.txt`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // Initialize
    updateButtonStates();
  </script>
</body>
</html>
