<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BAIF Offline Translator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); }
    .result-box { background: linear-gradient(145deg, #f8fafc, #f1f5f9); }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">

  <div class="max-w-5xl mx-auto p-4 md:p-8">
    <!-- Header -->
    <div class="text-center mb-10">
      <h1 class="text-4xl md:text-5xl font-bold text-blue-700 mb-3">BAIF Offline Translator</h1>
      <p class="text-gray-600 text-lg">English • Hindi • Marathi | 100% Offline</p>
    </div>

    <div class="grid md:grid-cols-2 gap-6">

      <!-- 1. Transcription -->
      <div class="glass rounded-3xl shadow-xl p-6 border border-gray-100">
        <div class="flex items-center gap-3 mb-5">
          <i class="fas fa-microphone text-2xl text-blue-600"></i>
          <h3 class="text-xl font-semibold">1. Transcription</h3>
        </div>
        <input type="file" id="mediaFile" accept="audio/*,video/*" 
               class="block w-full text-sm text-gray-500 file:mr-4 file:py-4 file:px-8 file:rounded-2xl file:border-0 file:text-sm file:font-medium file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer">
        <button onclick="transcribe()" 
                class="mt-6 w-full bg-blue-600 hover:bg-blue-700 py-4 rounded-2xl text-white font-semibold text-lg transition-all active:scale-95">
          🚀 Transcribe Now
        </button>
      </div>

      <!-- 2. Translation -->
      <div class="glass rounded-3xl shadow-xl p-6 border border-gray-100">
        <div class="flex items-center gap-3 mb-5">
          <i class="fas fa-language text-2xl text-green-600"></i>
          <h3 class="text-xl font-semibold">2. Translation</h3>
        </div>
        <select id="targetLang" 
                class="w-full p-4 border border-gray-300 rounded-2xl text-lg focus:ring-4 focus:ring-green-200 focus:border-green-500">
          <option value="en">English</option>
          <option value="hi">Hindi</option>
          <option value="mr">Marathi</option>
        </select>
        <button onclick="translateText()" 
                class="mt-6 w-full bg-green-600 hover:bg-green-700 py-4 rounded-2xl text-white font-semibold text-lg transition-all active:scale-95">
          🌐 Translate
        </button>
      </div>

    </div>

    <!-- Action Buttons -->
    <div class="flex flex-wrap gap-4 justify-center mt-10">
      <button onclick="generateTTS()" 
              class="flex-1 md:flex-none bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-4 px-10 rounded-3xl flex items-center justify-center gap-3 text-lg transition-all">
        <i class="fas fa-volume-up"></i> Generate Voice
      </button>
      <button onclick="generateSRT()" 
              class="flex-1 md:flex-none bg-amber-600 hover:bg-amber-700 text-white font-semibold py-4 px-10 rounded-3xl flex items-center justify-center gap-3 text-lg transition-all">
        <i class="fas fa-file-alt"></i> Generate SRT
      </button>
    </div>

    <!-- Status -->
    <div id="status" class="mt-8 text-center font-medium text-lg min-h-[32px]"></div>

    <!-- Result -->
    <div id="result" class="result-box rounded-3xl p-8 shadow-inner text-gray-700 leading-relaxed text-[17px] min-h-[180px]"></div>

    <!-- Audio Player -->
    <div id="audioPlayer" class="mt-6"></div>

    <!-- SRT Download -->
    <div id="srtLink" class="mt-6 text-center"></div>
  </div>

  <script>
    let currentText = "";
    let currentTranslatedText = "";
    let currentSegments = [];

    // Tailwind Script (already loaded via CDN)

    async function transcribe() {
      const fileInput = document.getElementById('mediaFile');
      const status = document.getElementById('status');
      const resultDiv = document.getElementById('result');

      if (!fileInput.files.length) {
        alert("Please select an audio or video file");
        return;
      }

      status.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Transcribing...`;
      const formData = new FormData();
      formData.append("file", fileInput.files[0]);

      try {
        const res = await fetch("/transcribe", { method: "POST", body: formData });
        const data = await res.json();
        
        if (data.status === "success") {
          currentText = data.transcribed_text;
          currentTranslatedText = data.transcribed_text;
          currentSegments = data.segments || [];
          
          status.innerHTML = `✅ Transcription Completed`;
          resultDiv.innerHTML = `<strong class="text-blue-700">Transcribed Text:</strong><br><br>${currentText}`;
        }
      } catch (e) {
        status.innerHTML = `❌ Transcription Failed`;
      }
    }

    async function translateText() {
      const status = document.getElementById('status');
      const resultDiv = document.getElementById('result');
      const targetLang = document.getElementById('targetLang').value;

      if (!currentText) {
        alert("Please transcribe first!");
        return;
      }

      status.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Translating...`;
      const formData = new FormData();
      formData.append("text", currentText);
      formData.append("target_lang", targetLang);

      try {
        const res = await fetch("/translate", { method: "POST", body: formData });
        const data = await res.json();
        
        if (data.status === "success") {
          currentTranslatedText = data.translated;
          status.innerHTML = `✅ Translation Completed`;
          resultDiv.innerHTML += `<br><br><strong class="text-green-700">Translated (${targetLang}):</strong><br>${data.translated}`;
        }
      } catch (e) {
        status.innerHTML = `❌ Translation Failed`;
      }
    }

    async function generateTTS() {
      const status = document.getElementById('status');
      const audioDiv = document.getElementById('audioPlayer');

      if (!currentTranslatedText) {
        alert("Please translate the text first!");
        return;
      }

      status.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Generating Voice...`;
      const formData = new FormData();
      formData.append("text", currentTranslatedText);
      formData.append("lang", document.getElementById('targetLang').value);

      try {
        const res = await fetch("/tts", { method: "POST", body: formData });
        const data = await res.json();

        if (data.status === "success" && data.audio_url) {
          status.innerHTML = `✅ Voice Generated!`;
          audioDiv.innerHTML = `
            <audio controls class="w-full mt-4">
              <source src="${data.audio_url}" type="audio/mp3">
            </audio>`;
        } else {
          status.innerHTML = data.message || "✅ Voice ready (English only)";
        }
      } catch (e) {
        status.innerHTML = `❌ Voice Generation Failed`;
      }
    }

    async function generateSRT() {
      const status = document.getElementById('status');
      const srtDiv = document.getElementById('srtLink');

      if (currentSegments.length === 0) {
        alert("Please transcribe first!");
        return;
      }

      status.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Generating SRT...`;
      const formData = new FormData();
      formData.append("segments", JSON.stringify(currentSegments));
      formData.append("filename", "baif_audio");

      try {
        const res = await fetch("/generate_srt", { method: "POST", body: formData });
        const data = await res.json();
        
        if (data.status === "success") {
          status.innerHTML = `✅ SRT Generated!`;
          srtDiv.innerHTML = `
            <a href="${data.srt_url}" download 
               class="inline-flex items-center gap-2 bg-amber-600 text-white px-8 py-4 rounded-2xl hover:bg-amber-700">
              📥 Download SRT Subtitle File
            </a>`;
        }
      } catch (e) {
        status.innerHTML = `❌ SRT Generation Failed`;
      }
    }
  </script>
</body>
</html>
